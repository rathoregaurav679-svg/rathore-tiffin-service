<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rathore Tiffin Service | Ghar Jaisa Khana</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ===== GENERAL ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
  scroll-behavior:smooth;
}

body{
  background:#0f0f0f;
  color:#ffffff;
}

/* ===== NAVBAR ===== */
.navbar{
  position: fixed;
  top:0;
  left:0;
  width:100%;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
  z-index:1000;
  border-bottom:1px solid rgba(212,175,55,0.3);
}

.navbar .logo{
  font-size:22px;
  font-weight:700;
  color:#d4af37;
}

.navbar .nav-links a{
  color:#cccccc;
  margin-left:25px;
  text-decoration:none;
  font-weight:500;
  transition:0.3s;
}

.navbar .nav-links a:hover{
  color:#d4af37;
}

/* ===== HERO ===== */
.hero{
  height:100vh;
  background:url("https://images.unsplash.com/photo-1546833999-b9f581a1996d") center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background: rgba(0,0,0,0.75);
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:800px;
  padding:20px;
}

.hero h1{
  font-size:50px;
  font-weight:700;
  margin-bottom:15px;
  color:#d4af37;
}

.tagline{
  font-size:20px;
  margin-bottom:30px;
  color:#dddddd;
}

/* ===== BUTTON ===== */
.btn{
  padding:14px 35px;
  border-radius:40px;
  font-weight:600;
  font-size:16px;
  border:none;
  cursor:pointer;
  background:linear-gradient(45deg,#d4af37,#f1c40f);
  color:#000;
  transition:0.3s;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(212,175,55,0.4);
}

/* ===== PLANS ===== */
.plans{
  padding:100px 20px;
  text-align:center;
  background:#111111;
}

.plans h2{
  color:#d4af37;
}

.plan-container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:30px;
  margin-top:50px;
}

.plan{
  background:#1a1a1a;
  padding:30px;
  border-radius:20px;
  width:300px;
  border:1px solid rgba(212,175,55,0.4);
  transition:0.3s;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.plan:hover{
  transform:translateY(-8px);
  border:1px solid #d4af37;
  box-shadow:0 15px 35px rgba(212,175,55,0.3);
}

.plan h3{
  color:#d4af37;
}

/* ===== GALLERY ===== */
.veg-section{
  padding:80px 20px;
  text-align:center;
  background:#0f0f0f;
}

.veg-section h2{
  margin-bottom:40px;
  font-size:32px;
  font-weight:600;
  color:#d4af37;
}

.slider{
  display:flex;
  gap:25px;
  overflow-x:auto;
  cursor:grab;
  scroll-behavior:smooth;
}

.slider::-webkit-scrollbar{
  display:none;
}

.meal-card{
  flex:0 0 auto;
  width:300px;
  height:300px;
}

.meal-card img{
  width:300px;
  height:300px;
  object-fit:cover;
  border-radius:15px;
  box-shadow:0 8px 25px rgba(0,0,0,0.6);
  transition:0.4s;
}

.meal-card img:hover{
  transform:scale(1.05);
}

/* ===== REVIEWS ===== */
.reviews-section{
  padding:80px 20px;
  background:#111111;
  text-align:center;
}

.review-heading{
  font-size:36px;
  margin-bottom:50px;
  color:#d4af37;
  font-weight:bold;
}

.review-card{
  background:#1a1a1a;
  border-radius:20px;
  border:1px solid rgba(212,175,55,0.3);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  color:#d4af37;
}

/* ===== MAP ===== */
.map{
  background:#111111 !important;
}

.map h2{
  color:#d4af37;
}

/* ===== FOOTER ===== */
.footer{
  background:#000;
  color:#ccc;
  padding:70px 40px 20px;
  margin-top:60px;
  border-top:1px solid rgba(212,175,55,0.3);
}

.footer h3{
  color:#d4af37;
}

.footer a:hover{
  color:#d4af37;
}

.footer-bottom{
  border-top:1px solid #222;
  color:#777;
}

/* ===== FLOATING WHATSAPP ===== */
.whatsapp-float{
  box-shadow:0 5px 20px rgba(212,175,55,0.5);
}

/* ===== BACK TO TOP ===== */
#topBtn{
  background:#d4af37;
  color:#000;
}
#topBtn:hover{
  background:#f1c40f;
}

</style>
</head>

<body>

<!-- YAHAN SE AAPKA PURA ORIGINAL BODY CODE SAME RAKHNA HAI -->
<!-- Navbar, Hero, Plans, Gallery, Reviews, Stats, Map, Booking Form, Footer — Sab Same -->
<!-- Sirf CSS Change Hua Hai -->

</body>
</html>
